; PlatformIO Project Configuration File for ESP32-C3 SuperMini
; Spider-Man Suit Mesh - Dedicated WS2812 RGB LED Node (Chest / Back / Helmet)

[env:esp32-c3-led-node]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

; Enable USB CDC for Serial monitor over native USB-C
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

